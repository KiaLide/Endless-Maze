<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0b14">
<title>Endless Maze</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 1. 標題畫面 -->
  <section id="scr-title" class="screen active">
    <canvas id="title-bg" width="192" height="240"></canvas>
    <div class="title-shade"></div>
    <img id="logo" src="assets/logo.png" alt="Endless Maze">
    <div id="title-heroes"></div>
    <div class="tap-start">TAP TO START</div>
    <div class="title-best" id="title-best"></div>
  </section>

  <!-- 2. 輸入名稱 -->
  <section id="scr-name" class="screen">
    <div class="panel">
      <h2>冒險者的名字是？</h2>
      <input id="name-input" type="text" maxlength="10" placeholder="輸入名稱" autocomplete="off" enterkeyhint="done">
      <p class="hint">最多 10 個字</p>
      <button class="btn primary" id="name-ok">確定</button>
    </div>
  </section>

  <!-- 3. 選擇角色 -->
  <section id="scr-select" class="screen">
    <div class="sex-tabs">
      <button class="sex-tab active" data-sex="M">♂ 男性</button>
      <button class="sex-tab" data-sex="F">♀ 女性</button>
    </div>
    <div id="carousel">
      <button class="car-arrow left" id="car-prev">◀</button>
      <div class="car-stage"><div class="car-ring" id="car-ring"></div></div>
      <button class="car-arrow right" id="car-next">▶</button>
    </div>
    <div class="class-info">
      <div class="ci-head"><span id="ci-name"></span><span id="ci-hero"></span></div>
      <p id="ci-desc"></p>
      <div class="ci-stats" id="ci-stats"></div>
      <div class="ci-weapon"><span class="wicon" id="ci-wicon"></span><span id="ci-wname"></span></div>
    </div>
    <button class="btn primary go" id="select-ok">出發！</button>
  </section>

  <!-- 4. 遊戲 -->
  <section id="scr-game" class="screen">
    <header id="hud">
      <div class="hud-row">
        <span id="hud-floor" class="tag">B1</span>
        <div id="hud-steps"></div>
        <span id="hud-lvl" class="tag">Lv1</span>
      </div>
      <div class="hud-row"><span id="hud-name"></span></div>
      <div class="bar hp"><div id="hp-fill"></div><span id="hp-text"></span></div>
      <div class="bar xp"><div id="xp-fill"></div></div>
      <div class="hud-row stats">
        <span>攻 <b id="st-atk"></b></span><span>防 <b id="st-def"></b></span>
        <span>爆 <b id="st-crit"></b></span><span>金 <b id="st-gold"></b></span><span>殺 <b id="st-kills"></b></span>
      </div>
      <div id="buffs"></div>
    </header>
    <div id="play-area">
      <div id="view-wrap">
        <canvas id="view" width="192" height="240"></canvas>
        <div id="flash"></div>
        <div id="enemy-bar" hidden><div class="en-name" id="en-name"></div><div class="en-hp"><i id="en-hp"></i></div></div>
        <div id="choice" hidden>
          <div class="ch ch-l">◀<small>左</small></div>
          <div class="ch ch-f">▲<small>前</small></div>
          <div class="ch ch-r">▶<small>右</small></div>
        </div>
        <div id="banner" hidden></div>
        <div id="swipe-hint">
          <div><b>←↑→</b> 滑動選擇路線</div>
          <div><b>●</b> 戰鬥時點擊畫面攻擊</div>
          <div><b>10</b> 次選擇後前往下一層</div>
        </div>
      </div>
      <div id="keypad">
        <div class="kp-title">鍵盤 / 小鍵盤</div>
        <div class="kp-grid">
          <span></span><button data-cmd="fw">↑<small>W</small></button><span></span>
          <button data-cmd="left">←<small>A</small></button><button data-cmd="atk">⚔<small>空白</small></button><button data-cmd="right">→<small>D</small></button>
        </div>
        <div class="kp-items">
          <button data-cmd="potion">藥水<small>1</small></button><button data-cmd="bomb">炸彈<small>2</small></button>
          <button data-cmd="knife">飛刀<small>3</small></button><button data-cmd="smoke">煙霧<small>4</small></button>
        </div>
      </div>
    </div>
    <div id="log"></div>
    <footer id="bottom">
      <button id="weapon-slot"><span class="wicon" id="hud-wicon"></span><span id="hud-wname"></span></button>
      <div id="items"></div>
    </footer>
  </section>

  <div id="modal"><div class="panel" id="modal-panel"></div></div>
</div>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
